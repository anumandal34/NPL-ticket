<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NPL Match Ticket</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="ticket" aria-label="Nepal Premier League match ticket">

  <section class="main">
    <header class="brand">
      <span class="logo">NPL</span>
      <span class="brand-text">Nepal Premier League<br>2026 Season</span>
    </header>

    <h1 class="match">
      <span>Kathmandu Gurkhas</span>
      <em>vs</em>
      <span>Pokhara Avengers</span>
    </h1>

    <dl class="details">
      <div><dt>Date</dt><dd>Sat, 12 Dec 2026</dd></div>
      <div><dt>First ball</dt><dd>2:00 PM</dd></div>
      <div class="wide"><dt>Venue</dt><dd>TU International Cricket Ground, Kirtipur</dd></div>
      <div><dt>Gate</dt><dd>B</dd></div>
      <div><dt>Stand</dt><dd>East</dd></div>
      <div><dt>Seat</dt><dd>Row 14, 22</dd></div>
    </dl>

    <p class="holder">Admit one &middot; Sita Sharma</p>
  </section>

  <section class="stub" aria-label="Entry stub">
    <div class="stub-top">
      <span class="price">NPR 1,500</span>
      <span class="stub-seat">East · B · 14/22</span>
    </div>
    <div class="barcode" role="img" aria-label="Ticket barcode"></div>
    <p class="serial">NPL26-0412-00871</p>
  </section>

</main>
</body>
</html>
